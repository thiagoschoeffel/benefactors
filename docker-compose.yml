version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: benefactors_app
        ports:
            - '8001:80'
        environment:
            APP_ENV: local
            APP_KEY: ${APP_KEY}
            APP_DEBUG: 'true'
            APP_URL: http://localhost:8001
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: laravel
            DB_USERNAME: root
            DB_PASSWORD: ''
        volumes:
            - .:/var/www/html
            - /var/www/html/vendor
            - /var/www/html/node_modules
            - /var/www/html/public/build
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - app-network

    mysql:
        image: mysql:8.0
        container_name: mysql_container
        ports:
            - '3306:3306'
        environment:
            MYSQL_DATABASE: laravel
            MYSQL_ROOT_PASSWORD: ''
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        command: --default-authentication-plugin=mysql_native_password
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    mysql_data:
        driver: local
